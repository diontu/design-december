<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Design December</title>
  <style>
    :root { color-scheme: light dark; --bg: #fafafa; --fg: #111; --muted: #666; --card: #fff; --border: #e5e5e5; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f0f0f; --fg: #f2f2f2; --muted: #999; --card: #1a1a1a; --border: #2a2a2a; } }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg); }
    main { max-width: 880px; margin: 0 auto; padding: 64px 16px; }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); margin: 0 0 8px; letter-spacing: -0.02em; }
    p { color: var(--muted); margin: 0 0 40px; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
    a { display: block; padding: 24px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; color: inherit; text-decoration: none; transition: transform .15s; }
    a:hover { transform: translateY(-2px); }
    .num { font-size: 2rem; font-weight: 700; }
    .label { color: var(--muted); font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Design December</h1>
    <p>One website design a day.</p>
    <ul>
      <!-- Add a new <li> for each design -->
      <li><a href="/1/"><div class="num">01</div><div class="label">Day 1</div></a></li>
    </ul>
  </main>
</body>
</html>
